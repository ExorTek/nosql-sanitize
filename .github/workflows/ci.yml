name: CI

on:
  workflow_dispatch: # manual run: Actions tab → CI → "Run workflow", or `gh workflow run ci.yml`
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format · test · integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --immutable

      # format:check (prettier) → unit tests in every workspace → type tests
      # (tsc over packages/*/test/types) → the express/fastify 4+5 integration
      # servers (test-servers/run-all-tests.js).
      - run: yarn verify

  # Newer Node lines. Kept out of `verify` because branch protection requires
  # that job by its exact name, which a matrix would change.
  compat:
    name: test · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: yarn install --immutable

      - run: yarn test
      - run: yarn test:servers
      # Coverage report in the job log (node:test's built-in coverage)
      - if: matrix.node == 22
        run: yarn test:coverage
